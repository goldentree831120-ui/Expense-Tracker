# ---- Server ----
server.port=8080

# ---- MySQL connection ----
# Create the database first: CREATE DATABASE expense_tracker;
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MaxMindGreen#123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" auto-creates/updates tables from the entities - convenient for a
# portfolio project. For anything production-like you'd switch to
# Flyway/Liquibase migrations and set this to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
